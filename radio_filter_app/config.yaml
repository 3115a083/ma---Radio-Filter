name: Music Assistant with Radio Filter
version: 0.1.0
slug: radio_filter_app
description: Music Assistant server with the Radio Filter plugin preinstalled
url: https://github.com/3115a083/ma---Radio-Filter
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:radio
panel_title: Radio Filter
init: false
apparmor: true
map:
  - media:rw
  - ssl:ro
backup_exclude:
  - cache.db
  - .cache/*
  - library.db.backup
stage: experimental
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
